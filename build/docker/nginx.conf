# Nginx Configuration for Microservice Reverse Proxy

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # 1. Load Balancing Upstream for the Gateway Service
    # Мы используем имя сервиса 'gateway'.
    # Docker's internal DNS автоматически распределит трафик по всем запущенным инстансам 'gateway'.
    # Чтобы получить 3 инстанса, запустите: docker-compose up --scale gateway=3
    upstream gateway_backend {
        server gateway:9097;
    }

    server {
        listen 80;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'OK';
        }

        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;

            proxy_pass http://gateway_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location ~ ^/swagger/(.*\.json)$ {
                    proxy_pass http://swagger-ui:8080;

                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 4. Proxy Pass for Swagger UI (/swagger)
        # Перенаправляем на swagger-ui, который слушает порт 8080
        location /swagger/ {
            rewrite ^/swagger/(.*)$ /$1 break;
            proxy_pass http://swagger-ui:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            return 404;
        }
    }
}
